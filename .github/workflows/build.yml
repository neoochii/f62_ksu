name: Kernel Build (Fifteen Branch)

on:
  push:
    branches:
      - 15

permissions:
  contents: write   # ✅ Needed to create releases with GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex git curl \
            zip unzip cpio python3 python3-pip \
            libncurses5-dev libssl-dev wget \
            libelf-dev fakeroot

      - name: Run build script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.sha }}   # Release tagged with commit SHA
          name: "Kernel Build - ${{ github.sha }}"
          body: |
            Automated kernel build from branch **fifteen**
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build folder files to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
