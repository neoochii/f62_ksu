name: Kernel Build

on:
  push:
    branches:
      - origin
      - 15   # adjust to your branch
  pull_request:
    branches:
      - origin
      - 15

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true   # fetch submodules if your kernel repo uses them

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex git curl \
            zip unzip cpio python3 python3-pip \
            libncurses5-dev libssl-dev wget \
            libelf-dev fakeroot

      - name: Run build script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: out/   # change if your build output is somewhere else

